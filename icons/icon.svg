<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="72%">
      <stop offset="0" stop-color="#1b1342"/><stop offset="0.5" stop-color="#0a0b1f"/><stop offset="1" stop-color="#05070e"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d1"/><stop offset="0.35" stop-color="#f2c46b"/><stop offset="0.7" stop-color="#b07cff"/><stop offset="1" stop-color="#6b4bd6"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" x2="1">
      <stop offset="0" stop-color="#7f5cff" stop-opacity="0"/><stop offset="0.16" stop-color="#9b6bff"/><stop offset="0.38" stop-color="#f2c46b"/>
      <stop offset="0.5" stop-color="#fffaf0"/><stop offset="0.62" stop-color="#f2c46b"/><stop offset="0.84" stop-color="#52e4f0"/><stop offset="1" stop-color="#52e4f0" stop-opacity="0"/>
    </linearGradient>
    <filter id="b12" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="b5" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="b2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <clipPath id="top"><rect x="0" y="0" width="512" height="262"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#fff"><circle cx="86" cy="98" r="2.2" opacity=".7"/><circle cx="420" cy="92" r="1.8" opacity=".6"/><circle cx="440" cy="412" r="2.3" opacity=".5"/><circle cx="66" cy="392" r="1.6" opacity=".5"/><circle cx="372" cy="150" r="1.3" opacity=".45"/></g>
  <g transform="rotate(-12 256 262)">
    <circle cx="256" cy="262" r="106" fill="none" stroke="url(#ring)" stroke-width="30" filter="url(#b12)" opacity=".9"/>
    <circle cx="256" cy="262" r="100" fill="none" stroke="url(#ring)" stroke-width="13" filter="url(#b5)"/>
    <!-- moitié arrière du disque, derrière l'ombre -->
    <path d="M40 262 A216 30 0 0 1 472 262" fill="none" stroke="url(#disk)" stroke-width="26" filter="url(#b12)" opacity=".7"/>
    <path d="M40 262 A216 30 0 0 1 472 262" fill="none" stroke="url(#disk)" stroke-width="7" opacity=".7"/>
    <circle cx="256" cy="262" r="80" fill="#000"/>
    <circle cx="256" cy="262" r="82" fill="none" stroke="#fff4dc" stroke-width="2.6" filter="url(#b2)"/>
    <!-- moitié avant du disque, devant l'ombre -->
    <path d="M40 262 A216 30 0 0 0 472 262" fill="none" stroke="url(#disk)" stroke-width="30" filter="url(#b12)" opacity=".85"/>
    <path d="M40 262 A216 30 0 0 0 472 262" fill="none" stroke="url(#disk)" stroke-width="13"/>
    <path d="M40 262 A216 30 0 0 0 472 262" fill="none" stroke="#fffaf0" stroke-width="3" opacity=".85"/>
  </g>
</svg>
